<rect x="50" y="616" width="1300" height="146" rx="8" fill="#fdf1e6"/>
<text x="700" y="652" text-anchor="middle" font-size="25" fill="#7a3d00" font-weight="bold">Pin sırası modüle göre değişir: bazı OLED'lerde GND önce, bazılarında</text>
<text x="700" y="692" text-anchor="middle" font-size="25" fill="#7a3d00" font-weight="bold">VCC önce gelir.</text>
<text x="700" y="732" text-anchor="middle" font-size="25" fill="#7a3d00">Kablolamadan önce modülün üzerindeki yazıyı oku. VCC → 3V3.</text>
