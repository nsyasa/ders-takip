<svg viewBox="0 0 1400 882" xmlns="http://www.w3.org/2000/svg" width="1400" height="882" font-family="DejaVu Sans, Verdana, Arial, sans-serif"><rect width="1400" height="882" fill="white"/>
<text x="700.0" y="44" text-anchor="middle" font-size="38" font-weight="bold" fill="#16324f">Föy 6 devresi: SG90 servo, MB102 ile harici 5 V</text>
