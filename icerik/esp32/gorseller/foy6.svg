<text x="820" y="458" text-anchor="start" font-size="25" fill="#333" font-weight="bold">470 µF</text>
<rect x="50" y="676" width="1300" height="186" rx="8" fill="#fdf1e6"/>
<text x="700" y="712" text-anchor="middle" font-size="25" fill="#7a3d00" font-weight="bold">Servo ESP32'nin 3V3 ya da VIN pininden beslenmez. Yalnız GND'ler</text>
<text x="700" y="752" text-anchor="middle" font-size="25" fill="#7a3d00" font-weight="bold">ortaklanır.</text>
<text x="700" y="792" text-anchor="middle" font-size="25" fill="#7a3d00">MB102 jumper'ı 5 V konumunda; 3,3 V hattı kullanılmaz. Kondansatör: uzun bacak</text>
<text x="700" y="832" text-anchor="middle" font-size="25" fill="#7a3d00">(+) +5 V hattına. MB102'nin 5 V'unu ESP32'nin VIN pinine BAĞLAMA.</text>
